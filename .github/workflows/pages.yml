name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enrich portfolio content
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              'https://cdn.simpleicons.org/rohdeschwarz': 'https://commons.wikimedia.org/wiki/Special:FilePath/Logo_of_Rohde_%26_Schwarz_%282009%29.svg',
              'https://cdn.simpleicons.org/techmahindra': 'https://commons.wikimedia.org/wiki/Special:FilePath/TM_Logo_Color_Pos_RGB.svg',
              'https://cdn.simpleicons.org/wipro': 'https://commons.wikimedia.org/wiki/Special:FilePath/Wipro_new_logo.svg',
              'https://dsrc.com/wp-content/uploads/2024/02/dsrc-logo.png': 'https://dsrc.com/favicon.ico'
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          ford = '''<article class="job"><div class="period">CURRENT</div><div class="joblogo"><a href="https://www.ford.com/" target="_blank" rel="noopener" aria-label="Ford official website"><img src="https://cdn.simpleicons.org/ford" alt="Ford"></a></div><div class="jobbody"><h3>Tech Anchor · Python Architect · AI Tools Developer</h3><div class="co"><a href="https://www.ford.com/" target="_blank" rel="noopener">Ford Motor Company ↗</a></div><p>Engineering leader with 11+ years of experience in Python, AI tools, and platform engineering, currently working as a Tech Anchor at Ford Motor Company driving code quality, DevOps automation, and engineering governance.</p><p>I build scalable applications using Python (Django, Flask), Angular, and cloud platforms, while developing AI-powered developer tools and centralized engineering dashboards integrating SonarQube, FOSSA, and monitoring systems.</p><p>Leading initiatives around Tekton CI/CD pipelines, application health monitoring, developer productivity platforms, and engineering compliance frameworks while supporting Data Science and Data Engineering teams.</p><p>I regularly conduct engineering Gemba Walks, architecture reviews, and code quality assessments to continuously improve engineering maturity and delivery standards.</p><p>Passionate about mentoring engineers and enabling careers in tech — trained 250+ students in Python and software development through workshops and bootcamps.</p><h4>Specialties</h4><p>Python • AI Tools • DevOps • Platform Engineering • CI/CD • Tekton • Django • Flask • Angular • Cloud • ELK Stack</p></div></article>'''
          pattern = r'<article class="job"><div class="period">CURRENT</div>.*?</div></article>'
          s, n = re.subn(pattern, ford, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Ford experience block was not found; refusing to publish an incomplete update.')

          if 'Visics ATG India' not in s:
              dsrc_card = '<div class="company"><a class="company-link" href="https://dsrc.com/"'
              visics_card = '''<div class="company"><a class="company-link" href="https://www.visics.eu/" target="_blank" rel="noopener"><div class="logo"><span style="font-weight:800;color:#1769e0">VA</span></div><b>Visics ATG India</b><small>Lead R&amp;D Engineer · Safety Systems · Official website ↗</small></a></div>'''
              if dsrc_card not in s:
                  raise SystemExit('DSRC company card anchor was not found; refusing to publish an incomplete update.')
              s = s.replace(dsrc_card, visics_card + dsrc_card, 1)

          visics_job = '''<article class="job"><div class="period">LEAD R&amp;D</div><div class="joblogo"><a href="https://www.visics.eu/" target="_blank" rel="noopener" aria-label="Visics ATG official website"><span style="font-weight:800;color:#1769e0">VA</span></a></div><div class="jobbody"><h3>Lead R&amp;D Engineer · Safety Systems &amp; Intercom Research</h3><div class="co"><a href="https://www.visics.eu/" target="_blank" rel="noopener">Visics ATG India ↗</a></div><p>Worked from Chennai on R&amp;D for intercom and safety systems designed to reduce human error and improve worker safety in tunnel environments.</p><p>Travelled to the Netherlands to visit client factories, understand operational and safety challenges first-hand, and collaborate on field requirements.</p><p>Developed and researched safety-engineering applications that monitored tunnel environments, detected safety conditions and provided alerts to help protect people working in hazardous areas.</p><p>The work focused on applying software, intercom technology and safety engineering to prevent human-error incidents and help save human lives.</p></div></article>'''
          if 'Lead R&amp;D Engineer · Safety Systems &amp; Intercom Research' not in s:
              if ford not in s:
                  raise SystemExit('Updated Ford block was not found; refusing to publish an incomplete update.')
              s = s.replace(ford, ford + visics_job, 1)

          if 'VCA Safety Management Examination' not in s:
              vca_slide = '''<article class="slide"><div style="width:100%;height:390px;display:grid;place-items:center;background:#f8fafc;border:1px solid #e3e9f1;border-radius:12px"><div style="text-align:center;padding:30px"><div style="font-size:48px">VCA</div><div style="color:#1769e0;font-weight:800;letter-spacing:.08em">SAFETY MANAGEMENT</div><div style="margin-top:10px;color:#627086">Netherlands</div></div></div><div><div class="issuer">Safety Qualification · Netherlands</div><h3>VCA Safety Management Examination</h3><p>Completed the VCA Safety Management examination in the Netherlands as part of the safety-focused client-site and engineering work supporting industrial safety systems.</p><p>Demonstrates practical awareness of workplace safety, risk management and safe working practices in industrial environments.</p></div></article>'''
              marker = '</div><button class="arrow next"'
              if marker not in s:
                  raise SystemExit('Certification slider marker was not found; refusing to publish an incomplete update.')
              s = s.replace(marker, vca_slide + marker, 1)
              s = s.replace("const slides=document.getElementById('slides'),dots=document.getElementById('dots'),count=3", "const slides=document.getElementById('slides'),dots=document.getElementById('dots'),count=4")

          metric_anchor = '<div class="metric"><b>GCP</b><span>Cloud · Data · Optimization</span></div>'
          profile_metric = '<div class="metric"><b id="profileViews">—</b><span>Profile views</span></div>'
          if 'id="profileViews"' not in s:
              if metric_anchor not in s:
                  raise SystemExit('Dashboard metric anchor was not found; refusing to publish an incomplete update.')
              s = s.replace(metric_anchor, metric_anchor + profile_metric, 1)

          counter_script = '''<script>(async function(){const el=document.getElementById('profileViews');if(!el)return;try{const response=await fetch('https://countapi.mileshilliard.com/api/v1/hit/krishna-portfolio-profile-views-2026');const data=await response.json();if(typeof data.value==='number')el.textContent=data.value.toLocaleString()}catch(e){el.textContent='—'}})();</script>'''
          if 'krishna-portfolio-profile-views-2026' not in s:
              s = s.replace('</body>', counter_script + '</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit enriched site back to branch for Vercel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: publish enriched portfolio [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
